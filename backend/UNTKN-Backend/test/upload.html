<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UNTKN Product Image Upload</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
        }

        .box {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .login-button {
            background: #222;
            color: white;
        }

        .upload-button {
            background: #111;
            color: white;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            background: #f1f1f1;
            border-radius: 5px;
        }

        pre {
            margin-top: 15px;
            padding: 15px;
            background: #f1f1f1;
            white-space: pre-wrap;
            word-break: break-word;
            border-radius: 5px;
        }

        #preview {
            display: none;
            max-width: 300px;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 8px;
        }

        hr {
            margin: 30px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

        .product-info {
            background: #fafafa;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>UNTKN Product Image Upload</h1>

    <div class="product-info">
        Product:
        <strong>Classic Black Oversized T-Shirt</strong>
        <br>
        Product ID:
        <strong>1</strong>
    </div>


    <!-- ADMIN LOGIN -->

    <div class="box">

        <h2>Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Admin Password"
            autocomplete="current-password"
        >

        <button
            type="button"
            id="loginButton"
            class="login-button"
        >
            Login
        </button>

        <div
            id="loginStatus"
            class="status"
        >
            Please login first.
        </div>

        <pre
            id="loginResult"
            style="display: none;"
        ></pre>

    </div>


    <hr>


    <!-- PRODUCT IMAGE UPLOAD -->

    <div class="box">

        <h2>Upload Product Image</h2>

        <label for="productId">
            Product ID
        </label>

        <input
            type="number"
            id="productId"
            value="1"
            min="1"
        >

        <label for="image">
            Select Product Image
        </label>

        <input
            type="file"
            id="image"
            accept="image/*"
        >

        <button
            type="button"
            id="uploadButton"
            class="upload-button"
            disabled
        >
            Upload Image
        </button>

        <pre
            id="result"
            style="display: none;"
        ></pre>

        <img
            id="preview"
            alt="Uploaded product image"
        >

    </div>

</div>

<script src="/test/upload.js"></script>

</body>

</html>
